<!doctype html>
<html lang="ja">
  <head>
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js"
      async
      defer
    ></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>お問い合わせフォーム</title>
    <style>
      body {
        font-family:
          "Helvetica Neue", Arial, "ヒラギノ角ゴ Pro W3",
          "Hiragino Kaku Gothic Pro", メイリオ, Meiryo, sans-serif;
        background-color: #f4f7f6;
        display: flex;
        justify-content: center;
        padding: 40px 20px;
        margin: 0;
      }

      .form-container {
        background-color: #fff;
        padding: 30px 40px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 500px;
      }

      h2 {
        margin-top: 0;
        color: #333;
        text-align: center;
        margin-bottom: 25px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #555;
      }

      .required {
        color: #e74c3c;
        font-size: 0.8em;
        margin-left: 5px;
      }

      input[type="text"],
      input[type="email"],
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 14px;
      }

      input:focus,
      textarea:focus {
        border-color: #4caf50;
        outline: none;
      }

      textarea {
        resize: vertical;
        height: 140px;
      }

      button {
        width: 100%;
        background-color: #4caf50;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        font-weight: bold;
        transition: background 0.3s;
      }

      button:hover {
        background-color: #45a049;
      }
    </style>
  </head>
  <body>
    <div class="form-container">
      <h2>gitの確認　お問い合わせ</h2>
      <form action="#" method="POST" id="my-form">
        <!-- お名前 -->
        <div class="form-group">
          <label for="name">お名前 <span class="required">※必須</span></label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="山田 太郎"
            required
          />
        </div>

        <!-- メールアドレス -->
        <div class="form-group">
          <label for="email"
            >メールアドレス <span class="required">※必須</span></label
          >
          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@email.com"
            required
          />
        </div>

        <!-- 件名 -->
        <div class="form-group">
          <label for="subject">件名</label>
          <input
            type="text"
            id="subject"
            name="subject"
            placeholder="お問い合わせの件名"
          />
        </div>

        <!-- 内容 -->
        <div class="form-group">
          <label for="message"
            >お問い合わせ内容 <span class="required">※必須</span></label
          >
          <textarea
            id="message"
            name="message"
            placeholder="具体的な内容をご記入ください"
            required
          ></textarea>
        </div>

        <!-- 送信ボタン -->
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAEv_Tek0HmynP4dP"></div>
        <button type="submit">送信する</button>
      </form>
    </div>

    <script>
      const form = document.getElementById("my-form");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        // 3. フォームデータからトークンを取得
        const formData = new FormData(form);

        const sendData = {
          name: formData.get("name"),
          email: formData.get("email"),
          detail: formData.get("message"),
          "cf-turnstile-response": formData.get("cf-turnstile-response"),
        };

        // 送信前にトークンが存在するか簡易確認
        if (!sendData["cf-turnstile-response"]) {
          alert("Turnstileの検証を完了させてください");
          return;
        }

        try {
          // 3. バックエンドAPI ( /api/submit ) へ送信
          const response = await fetch("/api/submit", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(sendData),
          });

          const result = await response.json();

          // 4. バックエンドからの結果判定
          if (result.success) {
            alert(result.message); // 「送信が完了しました！」などの表示
            form.reset(); // フォームのリセット（必要に応じて）
          } else {
            alert("エラー: " + result.message);
          }
        } catch (error) {
          alert("通信エラーが発生しました");
        }
      });
    </script>
  </body>
</html>
